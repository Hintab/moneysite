# Builds the Docker image, starts it once as a smoke test, then publishes it to GitHub's
# registry as ghcr.io/hintab/moneysite, and to Docker Hub as hintab/moneysite once the
# DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets are set.
name: Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  GHCR_IMAGE: ghcr.io/hintab/moneysite   # registry names must be lowercase
  DOCKERHUB_IMAGE: hintab/moneysite
  # Secrets can't be tested in an "if", so they're copied here first.
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build for testing
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: moneysite:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A fresh install must start with an empty, root-owned data folder and no manual
      # chown: the app creates its database there, owned by Unraid's nobody:users (99:100),
      # and doesn't run as root.
      - name: Smoke test
        run: |
          set -e
          DATA="$RUNNER_TEMP/data"
          sudo mkdir -p "$DATA" && sudo chown root:root "$DATA" && sudo chmod 755 "$DATA"
          docker run -d --name smoke -p 8080:8080 -v "$DATA:/data" moneysite:test
          trap 'docker logs smoke' EXIT
          for i in $(seq 1 30); do curl -fsS -o /dev/null http://localhost:8080/ && break; sleep 2; done
          curl -fsS -o /dev/null http://localhost:8080/accounts
          curl -fsS -o backup.db http://localhost:8080/backup/download
          test -s backup.db
          test "$(sudo stat -c '%u:%g' "$DATA/money.db")" = "99:100"
          docker exec smoke sh -c 'grep "^Uid:" /proc/1/status' | grep -qv "\s0\s"
          echo "Smoke test passed"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Docker Hub is only added once its secrets exist, so builds keep working without them.
      - id: images
        run: |
          {
            echo "list<<EOF"
            echo "$GHCR_IMAGE"
            if [ -n "$DOCKERHUB_USERNAME" ]; then echo "$DOCKERHUB_IMAGE"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.images.outputs.list }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Publish
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

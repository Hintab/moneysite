# Builds the Docker image and publishes it to GitHub's registry as
# ghcr.io/hintab/moneysite, and to Docker Hub as hintab/moneysite once the
# DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets are set.
name: Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  GHCR_IMAGE: ghcr.io/hintab/moneysite   # registry names must be lowercase
  DOCKERHUB_IMAGE: hintab/moneysite
  # Secrets can't be tested in an "if", so they're copied here first.
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Docker Hub is only added once its secrets exist, so builds keep working without them.
      - id: images
        run: |
          {
            echo "list<<EOF"
            echo "$GHCR_IMAGE"
            if [ -n "$DOCKERHUB_USERNAME" ]; then echo "$DOCKERHUB_IMAGE"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.images.outputs.list }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
